<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Quizsmith</title>
  <meta name="description" content="Personalised tech quizzes with weighted answers, 3D animated result cards and shareable results.">

  <!-- Installable app (PWA) -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0A0E1A">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <!-- iPhone / iPad home-screen app -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Quizsmith">

  <!-- Fonts and libraries are bundled locally so the app works offline -->
  <link rel="stylesheet" href="fonts.css">
  <style>
    /* Pre-JSS fallback so the first frame is never unstyled */
    :root { color-scheme: dark; }
    html, body { margin: 0; background: #0A0E1A; color: #E8ECF8; font-family: "Atkinson Hyperlegible", system-ui, sans-serif; }
  </style>
  <!-- JSS: CSS-in-JS. The preset adds nesting, $refs, @global, camelCase and default units. -->
  <script src="jss.min.js"></script>
  <script src="jss-preset-default.min.js"></script>
</head>
<body>
  <div id="app"></div>
  <script>
    window.QUIZSMITH_APP = { version: '1.0.3' };
    /* Start-up check: if a file is missing or broken, show which one instead of a blank screen */
    (function () {
      var problems = [];
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (t && t !== window && (t.src || t.href)) problems.push('Missing file: ' + (t.src || t.href).split('/').slice(-2).join('/'));
        else if (e.message) problems.push('Error in ' + (e.filename || 'page').split('/').slice(-2).join('/') + ' line ' + e.lineno + ': ' + e.message);
      }, true);
      window.addEventListener('load', function () {
        setTimeout(function () {
          var app = document.getElementById('app');
          if (app && !app.children.length) {
            if (!window.jss) problems.push('jss.min.js did not load');
            if (typeof TOPICS === 'undefined') problems.push('questions.js is missing or has a mistake in it');
            if (typeof styles === 'undefined') problems.push('styles.js is missing or has a mistake in it');
            if (typeof TOPICS !== 'undefined' && typeof styles !== 'undefined') problems.push('app.js is missing or has a mistake in it');
            app.innerHTML = '<div style="max-width:560px;margin:40px auto;padding:20px;font:16px/1.5 system-ui,sans-serif;color:#E8ECF8">' +
              '<h2 style="margin:0 0 8px;color:#FF7A70">Quizsmith couldn’t start</h2>' +
              '<p style="margin:0 0 10px">Make sure every file from <b>quizsmith-app</b> was uploaded, and that no file was edited by accident.</p>' +
              '<pre style="white-space:pre-wrap;background:#121A2E;padding:12px;border-radius:8px;color:#F5C04A">' +
              (problems.length ? problems.join('\n').replace(/</g, '&lt;') : 'No details available.') + '</pre></div>';
          }
        }, 300);
      });
    })();
  </script>
  <script src="questions.js"></script>
  <script src="styles.js"></script>
  <script src="app.js"></script>
</body>
</html>
